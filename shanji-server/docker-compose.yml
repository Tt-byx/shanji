services:
  db:
    image: mysql:8.4
    container_name: shanji-db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-shanji}
      MYSQL_USER: ${MYSQL_USER:-shanji}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shanji123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - shanji_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: shanji-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-shanji}
      MYSQL_USER: ${MYSQL_USER:-shanji}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shanji123}
      JWT_SECRET: ${JWT_SECRET:-shanji-dev-secret-key-change-me-in-production-2026}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  shanji_mysql_data:
